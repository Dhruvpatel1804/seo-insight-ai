services:
  web:
    build: .
    image: dhruvinnvonix/seo-insight-ai:1.0.0
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./reports:/app/reports
      - ./logs:/app/logs
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
